<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a18" />
      <stop offset="40%" stop-color="#140f2d" />
      <stop offset="100%" stop-color="#220b38" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.8" />
    </linearGradient>

    <!-- Main Play / Prism Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="35%" stop-color="#00bbf9" />
      <stop offset="70%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Light Beam Cut Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#f72585" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Sparkle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="12" />

  <!-- Background Ambient Glow Behind Play Icon -->
  <circle cx="270" cy="256" r="140" fill="#9d4edd" opacity="0.25" filter="url(#glow)" />
  <circle cx="210" cy="220" r="100" fill="#00f5d4" opacity="0.2" filter="url(#glow)" />

  <!-- Filmstrip Notch Accents on the Left -->
  <rect x="76" y="160" width="14" height="26" rx="5" fill="#00f5d4" opacity="0.75" />
  <rect x="76" y="210" width="14" height="26" rx="5" fill="#00bbf9" opacity="0.85" />
  <rect x="76" y="260" width="14" height="26" rx="5" fill="#9d4edd" opacity="0.85" />
  <rect x="76" y="310" width="14" height="26" rx="5" fill="#ff007f" opacity="0.75" />

  <!-- Filmstrip Timeline Vertical Guide -->
  <line x1="104" y1="140" x2="104" y2="360" stroke="#9d4edd" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Central Modern Glowing Play Triangle with Rounded Vertices -->
  <path d="M 176 148 
           C 176 136, 190 128, 202 135 
           L 384 243 
           C 396 250, 396 266, 384 273 
           L 202 381 
           C 190 388, 176 380, 176 368 
           Z" 
        fill="url(#playGrad)" 
        filter="url(#subtleGlow)" />

  <!-- Light Beam / Laser Cut Slices across play button (Precision Cut Symbol) -->
  <path d="M 270 120 L 320 120 L 230 400 L 180 400 Z" fill="url(#bgGrad)" opacity="0.75" />
  <line x1="300" y1="120" x2="210" y2="400" stroke="url(#beamGrad)" stroke-width="8" stroke-linecap="round" filter="url(#subtleGlow)" />

  <!-- Inner Play Center Highlight -->
  <polygon points="212,192 316,256 212,320" fill="#ffffff" opacity="0.2" />

  <!-- Radiant Light Sparkles (Top Right) -->
  <!-- Big 4-point Sparkle -->
  <g transform="translate(380, 100)" filter="url(#subtleGlow)">
    <path d="M 0 -28 Q 0 0 -28 0 Q 0 0 0 28 Q 0 0 28 0 Q 0 0 0 -28 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="5" fill="#00f5d4" />
  </g>
  <!-- Small Accent Sparkle -->
  <g transform="translate(425, 145)">
    <path d="M 0 -14 Q 0 0 -14 0 Q 0 0 0 14 Q 0 0 14 0 Q 0 0 0 -14 Z" fill="#00f5d4" opacity="0.9" />
  </g>
</svg>